server:
  port: 8082
  forward-headers-strategy: framework
  # teste
spring:
  profiles:
    active: dev
  application:
    name: salas-service
  datasource:
    url: jdbc:h2:mem:salasdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true